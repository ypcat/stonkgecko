name: Build & Deploy stonkgecko

on:
  schedule:
    # Every 6 hours. Yahoo intermittently rate-limits CI runners; multiple
    # attempts per day mean a blocked window doesn't skip the daily refresh.
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

# Allow the GITHUB_TOKEN to deploy to Pages and read the repo
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.build.outputs.deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache Mix.install deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/mix
          key: mix-install-${{ hashFiles('build.exs') }}
          restore-keys: mix-install-

      # build.exs exits 0 and writes public/index.html only when it fetched
      # enough live data. If Yahoo throttled the runner it exits 0 without
      # writing, so we skip the deploy (keeping the last good site) instead of
      # failing the whole workflow. A real crash still exits non-zero -> fails.
      - name: Build site
        id: build
        run: |
          elixir build.exs
          if [ -f public/index.html ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Yahoo throttled this run — no data fetched, skipping deploy. The last good site stays live."
          fi

      - name: Upload Pages artifact
        if: steps.build.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
